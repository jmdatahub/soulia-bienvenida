<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soul IA · Pompa #1 (prototipo)</title>
<style>
  :root{
    --bg0:#07070b; --bg1:#10101a;
    --orange:#f97316; --orange-light:#fb923c; --orange-deep:#ea580c;
    --cyan:#22d3ee; --text:#f0f0f5; --muted:#8a8a9a;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#07070b}
  body{font-family:var(--font);color:var(--text)}
  #stage{position:fixed;inset:0;display:block;cursor:pointer}
  .hint{
    position:fixed;left:50%;bottom:46px;transform:translateX(-50%);
    font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);pointer-events:none;user-select:none;
    transition:opacity .6s ease;text-align:center;
  }
  .hint b{color:var(--orange-light);font-weight:600}
  .ui{position:fixed;top:18px;right:18px;display:flex;gap:10px;z-index:5}
  .ui button{
    font-family:var(--font);font-size:12px;letter-spacing:.04em;
    color:var(--muted);background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);border-radius:9px;
    padding:8px 12px;cursor:pointer;transition:all .15s ease;backdrop-filter:blur(6px)
  }
  .ui button:hover{color:var(--text);border-color:rgba(249,115,22,.5);background:rgba(249,115,22,.08)}
  .badge{
    position:fixed;top:18px;left:18px;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);user-select:none
  }
  .badge b{color:var(--orange-light)}
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="badge">SOUL <b>IA</b> · prototipo pompa #1</div>
  <div class="ui">
    <button id="sound">🔊 Sonido</button>
    <button id="replay">↻ Reiniciar</button>
  </div>
  <div class="hint" id="hint">haz clic en la <b>pompa</b> para explotarla</div>

<script>
/* ============================================================
   Soul IA — Pompa premium (prototipo de UNA pompa)
   Objetivo: validar el NIVEL antes de escalar a la intro completa.
   Principios: easing real, anticipación, overshoot, stagger,
   física viva, glow que respira, cristal con reflejo, exit cuidado.
   ============================================================ */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const hintEl = document.getElementById('hint');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

/* ---------- Paleta ---------- */
const C = {
  orange:'#f97316', orangeL:'#fb923c', orangeD:'#ea580c',
  cyan:'#22d3ee', warmWhite:'#fff3e6'
};

/* ---------- Easings ---------- */
const easeOutCubic = t => 1-Math.pow(1-t,3);
const easeInCubic  = t => t*t*t;
const easeOutExpo  = t => t>=1?1:1-Math.pow(2,-10*t);
const easeInOutSine= t => -(Math.cos(Math.PI*t)-1)/2;
const easeOutBack  = t => {const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);

/* ---------- Sonido (Web Audio, sin archivos) ---------- */
let audioOn = true, actx=null;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioOn=false; } } if(actx&&actx.state==='suspended') actx.resume(); }
function popSound(){
  if(!audioOn) return; ensureAudio(); if(!actx) return;
  const t=actx.currentTime;
  // tono con caída rápida (cuerpo del pop)
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(640+Math.random()*120,t);
  o.frequency.exponentialRampToValueAtTime(180,t+0.12);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.32,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.2);
  // click de chispa (ruido corto filtrado)
  const n=actx.createBufferSource(), buf=actx.createBuffer(1,actx.sampleRate*0.05,actx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  n.buffer=buf; const ng=actx.createGain(); ng.gain.value=0.12;
  const bp=actx.createBiquadFilter(); bp.type='highpass'; bp.frequency.value=1800;
  n.connect(bp).connect(ng).connect(actx.destination); n.start(t);
}
document.getElementById('sound').addEventListener('click',e=>{
  audioOn=!audioOn; e.target.textContent = audioOn?'🔊 Sonido':'🔇 Silencio';
  if(audioOn) ensureAudio();
});

/* ---------- Polvo de fondo (parallax, vida sutil) ---------- */
const dust=[];
for(let i=0;i<46;i++) dust.push({x:Math.random(),y:Math.random(),r:rand(0.4,1.6),s:rand(0.004,0.018),a:rand(0.04,0.18),hue:Math.random()<0.25?C.cyan:C.orange});

/* ---------- Estado de la pompa ---------- */
const anchor={x:()=>W/2,y:()=>H*0.46};
const bubble={
  state:'enter',           // enter | idle | anticipate | gone
  r:0, baseR:0,
  ox:0, oy:0,              // offset de deriva
  vx:0, vy:0,
  bob:Math.random()*6.28,
  glow:1,
  scale:0,
  t:0,                    // tiempo de estado
  hl:0,                   // ángulo highlight
};
function setBaseR(){ bubble.baseR = clamp(Math.min(W,H)*0.135, 70, 150); }
setBaseR(); window.addEventListener('resize',setBaseR);

const particles=[];   // gotas
const shocks=[];      // ondas de choque
let flash=0;          // destello global
let mouse={x:-999,y:-999,down:false};

cv.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
cv.addEventListener('pointerleave',()=>{mouse.x=-999;mouse.y=-999;});
cv.addEventListener('pointerdown',e=>{ tryExplode(e.clientX,e.clientY); });

function bubblePos(){ return {x:anchor.x()+bubble.ox, y:anchor.y()+bubble.oy + Math.sin(bubble.bob)*8}; }

function tryExplode(px,py){
  if(bubble.state!=='idle') return;
  const p=bubblePos(); const d=Math.hypot(px-p.x,py-p.y);
  if(d <= bubble.baseR*1.15){
    bubble.state='anticipate'; bubble.t=0;
    if(hintEl) hintEl.style.opacity=0;
  }
}

function spawnExplosion(){
  const p=bubblePos(); const r=bubble.baseR*bubble.scale;
  popSound();
  flash = 1;
  // shockwave (anillo)
  shocks.push({x:p.x,y:p.y,r:r*0.7,max:r*3.2,life:1,col:C.orange});
  shocks.push({x:p.x,y:p.y,r:r*0.4,max:r*2.2,life:1,col:C.warmWhite,thin:true});
  // gotas (varias, todas distintas -> realismo)
  const n=14;
  for(let i=0;i<n;i++){
    const ang=(i/n)*6.28 + rand(-0.25,0.25);
    const sp=rand(2.2,6.8);
    particles.push({
      x:p.x+Math.cos(ang)*r*0.5, y:p.y+Math.sin(ang)*r*0.5,
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - rand(0.5,2),
      r:rand(2,7), life:1, decay:rand(0.012,0.026),
      col: Math.random()<0.22?C.cyan:(Math.random()<0.5?C.orange:C.orangeL),
      spin:rand(-0.2,0.2)
    });
  }
  // microgotas finas extra (stagger visual)
  for(let i=0;i<10;i++){
    const ang=rand(0,6.28), sp=rand(4,9);
    particles.push({x:p.x,y:p.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:rand(0.8,2.2),life:1,decay:rand(0.02,0.04),col:C.warmWhite});
  }
  bubble.state='gone'; bubble.t=0;
}

function update(dt){
  // dt en ms normalizado a 16.67
  const k=dt/16.67;

  // polvo
  for(const d of dust){ d.y-=d.s*0.01*k; if(d.y<-0.02) d.y=1.02; }

  // máquina de estados de la pompa
  bubble.t += dt;
  bubble.bob += 0.012*k;
  bubble.hl += 0.004*k;

  if(bubble.state==='enter'){
    const T=reduceMotion?1:700; const t=clamp(bubble.t/T,0,1);
    bubble.scale = reduceMotion? 1 : easeOutBack(t);
    bubble.glow = 0.5+0.5*t;
    if(t>=1){ bubble.state='idle'; bubble.t=0; bubble.scale=1; }
  }
  else if(bubble.state==='idle'){
    // respiración de escala y glow
    bubble.scale = 1 + Math.sin(bubble.t*0.0016)*0.018;
    bubble.glow  = 0.8 + Math.sin(bubble.t*0.0011+1)*0.2;
    // deriva browniana suave hacia el ancla + ruido
    bubble.vx += (rand(-1,1))*0.06*k - bubble.ox*0.0009*k;
    bubble.vy += (rand(-1,1))*0.06*k - bubble.oy*0.0009*k;
    // repulsión del ratón
    const p=bubblePos(); const dx=p.x-mouse.x, dy=p.y-mouse.y; const dist=Math.hypot(dx,dy);
    if(dist<bubble.baseR*2.0){ const f=(1-dist/(bubble.baseR*2.0))*0.9; bubble.vx+=(dx/dist)*f*k; bubble.vy+=(dy/dist)*f*k; }
    bubble.vx*=0.92; bubble.vy*=0.92;
    bubble.ox+=bubble.vx*k; bubble.oy+=bubble.vy*k;
  }
  else if(bubble.state==='anticipate'){
    const T=120; const t=clamp(bubble.t/T,0,1);
    bubble.scale = 1 - 0.09*easeOutCubic(t);   // se encoge (toma de aire)
    bubble.glow  = 0.8 + 1.4*t;                 // carga de luz
    if(t>=1){ spawnExplosion(); }
  }
  else if(bubble.state==='gone'){
    // espera y respawn
    const delay=reduceMotion?300:650;
    if(bubble.t>delay && particles.length<6){
      bubble.ox=0;bubble.oy=0;bubble.vx=0;bubble.vy=0;
      bubble.state='enter'; bubble.t=0; bubble.scale=0;
    }
  }

  // partículas
  for(let i=particles.length-1;i>=0;i--){
    const pa=particles[i];
    pa.x+=pa.vx*k; pa.y+=pa.vy*k; pa.vy+=0.12*k; pa.vx*=0.99;
    pa.life-=pa.decay*k; pa.r*=0.992;
    if(pa.life<=0) particles.splice(i,1);
  }
  // ondas
  for(let i=shocks.length-1;i>=0;i--){
    const s=shocks[i]; s.r=lerp(s.r,s.max,0.12*k); s.life-=0.04*k;
    if(s.life<=0) shocks.splice(i,1);
  }
  if(flash>0) flash=Math.max(0,flash-0.06*k);
}

/* ---------- Render ---------- */
function drawBackground(){
  const g=ctx.createRadialGradient(W/2,H*0.42,0, W/2,H*0.42, Math.max(W,H)*0.75);
  g.addColorStop(0,'#12121c'); g.addColorStop(0.55,'#0b0b12'); g.addColorStop(1,'#070709');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // polvo
  for(const d of dust){
    ctx.globalAlpha=d.a; ctx.fillStyle=d.hue;
    ctx.beginPath(); ctx.arc(d.x*W,d.y*H,d.r,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawBubble(){
  if(bubble.state==='gone') return;
  const p=bubblePos(); const r=bubble.baseR*bubble.scale; if(r<=1) return;
  const x=p.x,y=p.y;

  // 1) GLOW exterior (aditivo, respira)
  ctx.globalCompositeOperation='lighter';
  const gg=ctx.createRadialGradient(x,y,r*0.5, x,y,r*2.3);
  const ga=0.30*bubble.glow;
  gg.addColorStop(0,`rgba(249,115,22,${ga})`);
  gg.addColorStop(0.5,`rgba(249,115,22,${ga*0.35})`);
  gg.addColorStop(1,'rgba(249,115,22,0)');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r*2.3,0,6.28); ctx.fill();
  ctx.globalCompositeOperation='source-over';

  // 2) CUERPO de cristal (radial desplazado -> volumen)
  const bg=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.05, x,y,r);
  bg.addColorStop(0,'#23232f'); bg.addColorStop(0.55,'#14141d'); bg.addColorStop(1,'#0a0a10');
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill();

  // 2b) flecos internos (eco del isotipo: puntos naranja/cian) girando
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r*0.96,0,6.28); ctx.clip();
  for(let i=0;i<10;i++){
    const a=bubble.hl*0.6 + i*0.94; const rr=r*(0.25+ (i%5)*0.13);
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a*1.1)*rr*0.8;
    ctx.globalAlpha=0.5; ctx.fillStyle= i%3===0?C.cyan:C.orangeL;
    ctx.beginPath(); ctx.arc(px,py,(i%4===0?2.4:1.4),0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.restore();

  // 3) RIM light (borde con luz naranja, más fuerte abajo-derecha)
  ctx.lineWidth=Math.max(2,r*0.05);
  const rg=ctx.createLinearGradient(x-r,y-r,x+r,y+r);
  rg.addColorStop(0,'rgba(251,146,60,0.25)');
  rg.addColorStop(0.5,C.orange);
  rg.addColorStop(1,C.orangeD);
  ctx.strokeStyle=rg; ctx.shadowColor=C.orange; ctx.shadowBlur=18*bubble.glow;
  ctx.beginPath(); ctx.arc(x,y,r*0.985,0,6.28); ctx.stroke();
  ctx.shadowBlur=0;

  // 4) Reflejo especular (highlight) que se mueve
  const ha=-2.2+Math.sin(bubble.hl)*0.25;
  const hx=x+Math.cos(ha)*r*0.45, hy=y+Math.sin(ha)*r*0.45;
  ctx.globalCompositeOperation='lighter';
  const hg=ctx.createRadialGradient(hx,hy,0,hx,hy,r*0.5);
  hg.addColorStop(0,'rgba(255,243,230,0.55)'); hg.addColorStop(1,'rgba(255,243,230,0)');
  ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(hx,hy,r*0.5,0,6.28); ctx.fill();
  // pequeño brillo nítido
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(hx-r*0.05,hy-r*0.05,r*0.06,0,6.28); ctx.fill();
  ctx.globalCompositeOperation='source-over';
}

function drawParticles(){
  ctx.globalCompositeOperation='lighter';
  for(const pa of particles){
    ctx.globalAlpha=clamp(pa.life,0,1);
    const g=ctx.createRadialGradient(pa.x,pa.y,0,pa.x,pa.y,pa.r*2.2);
    g.addColorStop(0,pa.col); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pa.x,pa.y,pa.r*2.2,0,6.28); ctx.fill();
    ctx.globalAlpha=clamp(pa.life,0,1); ctx.fillStyle=pa.col;
    ctx.beginPath(); ctx.arc(pa.x,pa.y,pa.r*0.6,0,6.28); ctx.fill();
  }
  for(const s of shocks){
    ctx.globalAlpha=clamp(s.life,0,1)*0.8; ctx.strokeStyle=s.col;
    ctx.lineWidth=s.thin?1.5:3.5;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.stroke();
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

function drawFlash(){
  if(flash<=0) return;
  ctx.globalCompositeOperation='lighter';
  const p=bubblePos();
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,bubble.baseR*3.5);
  g.addColorStop(0,`rgba(255,200,140,${0.55*flash})`);
  g.addColorStop(0.4,`rgba(249,115,22,${0.25*flash})`);
  g.addColorStop(1,'rgba(249,115,22,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';
}

/* ---------- Loop ---------- */
let last=performance.now();
function frame(now){
  let dt=now-last; last=now; if(dt>50) dt=50;
  update(dt);
  drawBackground();
  drawBubble();
  drawParticles();
  drawFlash();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Reinicio ---------- */
document.getElementById('replay').addEventListener('click',()=>{
  particles.length=0; shocks.length=0; flash=0;
  bubble.ox=0;bubble.oy=0;bubble.vx=0;bubble.vy=0;
  bubble.state='enter'; bubble.t=0; bubble.scale=0;
  if(hintEl) hintEl.style.opacity=1;
});
</script>
</body>
</html>
