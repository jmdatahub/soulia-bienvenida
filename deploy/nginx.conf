server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html = experiencia completa (pompas + landing). Sin cache para poder iterar.
  location = /index.html { add_header Cache-Control "no-cache"; }

  # assets con cache larga (logos, gif, etc.)
  location /assets/ { expires 7d; add_header Cache-Control "public"; }

  # clean urls / fallback
  location / { try_files $uri $uri.html $uri/ /index.html; }

  # no indexar en buscadores (es para clientes, no SEO)
  add_header X-Robots-Tag "noindex, nofollow" always;
}
